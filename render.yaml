services:
  - type: web
    name: routepulse-api
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build -w @routepulse/shared && npm run build -w @routepulse/api
    startCommand: npm run start -w @routepulse/api
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: APP_ENV
        value: production
      - key: STRICT_CONFIG
        value: "false"
      - key: AUTH_MODE
        value: clerk
      - key: DEMO_AUTH_ENABLED
        value: "true"
      - key: QUEUE_MODE
        value: inline
      - key: MIGRATE_ON_START
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: WEB_ORIGIN
        value: https://routepulse.justshivamm.in,https://real-time-logistics-platform.vercel.app
      - key: DEFAULT_ORGANIZATION_ID
        value: org_demo
      - key: DATABASE_URL
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_WEBHOOK_SIGNING_SECRET
        sync: false
      - key: REDIS_URL
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: GOOGLE_SMTP_USER
        sync: false
      - key: GOOGLE_SMTP_APP_PASSWORD
        sync: false
      - key: GLITCHTIP_DSN
        sync: false
