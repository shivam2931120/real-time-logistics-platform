services:
  - type: web
    name: routepulse-api
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build -w @routepulse/shared && npm run build -w @routepulse/api
    startCommand: npm run start -w @routepulse/api
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: WEB_ORIGIN
        sync: false
      - key: AUTH_MODE
        value: clerk
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_WEBHOOK_SIGNING_SECRET
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: GOOGLE_SMTP_USER
        sync: false
      - key: GOOGLE_SMTP_APP_PASSWORD
        sync: false
      - key: EMAIL_FROM
        sync: false
  - type: worker
    name: routepulse-notification-worker
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build -w @routepulse/shared && npm run build -w @routepulse/api
    startCommand: node apps/api/dist/workers/notificationWorker.js
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: REDIS_URL
        sync: false
      - key: GOOGLE_SMTP_USER
        sync: false
      - key: GOOGLE_SMTP_APP_PASSWORD
        sync: false
      - key: EMAIL_FROM
        sync: false
