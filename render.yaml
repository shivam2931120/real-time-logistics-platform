services:
  - type: web
    name: routepulse-api
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build -w @routepulse/shared && npm run build -w @routepulse/api
    preDeployCommand: node apps/api/dist/db/migrate.js
    startCommand: npm run start -w @routepulse/api
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: AUTH_MODE
        value: demo
      - key: JWT_SECRET
        generateValue: true
      - key: WEB_ORIGIN
        value: http://localhost:5173,http://127.0.0.1:5173
