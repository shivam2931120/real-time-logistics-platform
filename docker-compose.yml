services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: routepulse
      POSTGRES_PASSWORD: routepulse
      POSTGRES_DB: routepulse
    ports: ["5433:5432"]
    volumes: [routepulse_pg:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U routepulse"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  routepulse_pg:
